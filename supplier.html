<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة المورّد · قدّاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* brand system (navy / rose / cream) */
    --navy:#01183a; --navy-dark:#000f28;
    --rose:#dca096; --rose-strong:#c98578; --rose-soft:#f4e4df;
    --cream-page:#fbf6ee; --cream:#f5ede0; --card:#fffdfa;
    --ink:#24303c; --muted:#8f8781; --line:#ece2d4;
    /* functional status colors (legibility only, not brand) */
    --ok:#2e7d5b; --ok-soft:#e6f1ea;
    --bad:#b23b34; --bad-soft:#f7e6e4;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;padding:0}
  body{
    font-family:'Tajawal',system-ui,Arial,sans-serif;
    background:var(--cream-page); color:var(--ink);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--navy); outline-offset:2px}

  /* ---------- top bars ---------- */
  .topbar{
    background:var(--navy); color:#fff; font-size:13px; font-weight:500;
    padding:7px 16px; text-align:center; letter-spacing:.2px;
  }
  header.appbar{
    background:var(--cream); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand .logo{
    width:40px; height:40px; border-radius:10px; object-fit:cover;
    display:grid; place-items:center; background:var(--cream);
    color:var(--rose-strong); font-size:22px; line-height:1; flex:0 0 auto;
  }
  .brand .names{display:flex; flex-direction:column; line-height:1.15}
  .brand .name-ar{font-weight:800; color:var(--navy); font-size:18px}
  .brand .name-sub{font-weight:500; color:var(--muted); font-size:12px}
  .appbar .spacer{flex:1}
  .appbar .tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  .updated{font-size:12px; color:var(--muted); white-space:nowrap}

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid transparent; border-radius:10px; padding:9px 14px;
    font-weight:700; font-size:14px; background:var(--navy); color:#fff;
    transition:background .12s ease, opacity .12s ease;
  }
  .btn:hover{background:var(--navy-dark)}
  .btn:disabled{opacity:.55; cursor:not-allowed}
  .btn.ghost{background:transparent; color:var(--navy); border-color:var(--line)}
  .btn.ghost:hover{background:var(--cream)}
  .btn.small{padding:7px 12px; font-size:13px; border-radius:9px}
  .btn.wide{width:100%}

  /* ---------- layout ---------- */
  main{max-width:760px; margin:0 auto; padding:16px 16px 48px}

  /* summary strip */
  .summary{
    display:flex; gap:12px; flex-wrap:wrap; margin:4px 0 18px;
  }
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; flex:1 1 140px; min-width:140px;
  }
  .stat .num{font-size:24px; font-weight:800; color:var(--navy); line-height:1}
  .stat .lbl{font-size:13px; color:var(--muted); margin-top:4px}
  .stat.attention .num{color:var(--rose-strong)}

  /* order card */
  .order{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 6px 20px rgba(1,24,58,.05); margin-bottom:16px; overflow:hidden;
  }
  .order-head{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .order-code{font-weight:800; color:var(--navy); font-size:17px; letter-spacing:.3px}
  .order-head .spacer{flex:1}
  .delivery{font-size:13px; color:var(--muted); width:100%; margin-top:2px}
  .delivery b{color:var(--ink); font-weight:700}

  /* order-status badge */
  .obadge{
    font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:rgba(1,24,58,.07); color:var(--navy); white-space:nowrap;
  }
  .obadge.good{background:var(--ok-soft); color:var(--ok)}
  .obadge.bad{background:var(--bad-soft); color:var(--bad)}

  /* line rows */
  .lines{padding:6px 16px}
  .line{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .line:last-child{border-bottom:none}
  .line .pname{font-weight:700; font-size:15px; color:var(--ink)}
  .line .qty{
    font-size:13px; font-weight:700; color:var(--navy);
    background:var(--rose-soft); border-radius:8px; padding:2px 9px; white-space:nowrap;
  }
  .line .grow{flex:1; min-width:120px}
  .line .actions{display:flex; gap:8px; flex-wrap:wrap}

  /* supplier-status chip */
  .sbadge{
    font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap;
  }
  .sbadge.pending{background:var(--rose-soft); color:var(--rose-strong)}
  .sbadge.confirmed{background:var(--ok-soft); color:var(--ok)}
  .sbadge.unavailable{background:var(--bad-soft); color:var(--bad)}
  .sbadge.prepared{background:rgba(1,24,58,.08); color:var(--navy)}
  .sbadge.picked_up{background:var(--navy); color:#fff}

  /* action buttons per line */
  .act{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:9px; padding:7px 12px; font-weight:700; font-size:13px;
    transition:all .12s ease;
  }
  .act:hover:not(:disabled){border-color:var(--navy)}
  .act:disabled{opacity:.5; cursor:not-allowed}
  .act.ok.on{background:var(--ok); border-color:var(--ok); color:#fff}
  .act.bad.on{background:var(--bad); border-color:var(--bad); color:#fff}
  /* forward "next step" action (prepared / picked_up): filled navy */
  .act.go{background:var(--navy); border-color:var(--navy); color:#fff}
  .act.go:hover:not(:disabled){background:var(--navy-dark); border-color:var(--navy-dark)}
  .act.busy{opacity:.6; pointer-events:none}

  .order-foot{padding:12px 16px; border-top:1px solid var(--line); background:#fffefb}
  .foot-note{font-size:13px; color:var(--muted); text-align:center; margin:0}

  /* login */
  .login-wrap{min-height:100vh; display:grid; place-items:center; padding:24px;
    background:linear-gradient(160deg,var(--cream-page),var(--cream))}
  .login{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    box-shadow:0 12px 40px rgba(1,24,58,.10); padding:32px 26px; width:100%; max-width:380px;
  }
  .login .brand{justify-content:center; margin-bottom:6px}
  .login h1{font-size:20px; font-weight:800; color:var(--navy); text-align:center; margin:8px 0 2px}
  .login p.sub{font-size:13px; color:var(--muted); text-align:center; margin:0 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px}
  .field input{
    width:100%; border:1px solid var(--line); border-radius:11px; padding:11px 13px;
    font-family:inherit; font-size:15px; background:#fff; color:var(--ink);
  }
  .field input:focus{border-color:var(--navy); outline:none}

  /* states */
  .msg{text-align:center; padding:48px 20px; color:var(--muted)}
  .msg .big{font-size:16px; font-weight:700; color:var(--ink); margin-bottom:6px}
  .error-box{
    background:var(--bad-soft); color:var(--bad); border:1px solid #eecac6;
    border-radius:11px; padding:11px 13px; font-size:13px; font-weight:500; margin-bottom:14px;
  }
  .info-box{
    background:var(--ok-soft); color:var(--ok); border:1px solid #cfe3d6;
    border-radius:11px; padding:11px 13px; font-size:13px; font-weight:500; margin-bottom:14px;
  }
  .link-btn{
    background:none; border:none; color:var(--navy); font-weight:700; font-size:13px;
    padding:6px 0 0; margin:10px auto 0; display:block; text-decoration:underline;
  }
  .link-btn:disabled{opacity:.5; cursor:not-allowed}
  .spin{
    width:15px; height:15px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff;
    border-radius:50%; display:inline-block; vertical-align:-2px; animation:sp .7s linear infinite;
  }
  .spin.dark{border-color:rgba(1,24,58,.25); border-top-color:var(--navy)}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center-load{display:grid; place-items:center; padding:56px 0}
  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  /* ---------- print buttons ---------- */
  .printbar{display:flex; gap:10px; flex-wrap:wrap; margin:0 0 16px}
  .printbar:empty{display:none}

  /* ---------- print sheet (hidden on screen) ---------- */
  #printArea{display:none}
  @media print{
    @page{size:A4; margin:10mm}
    html,body{background:#fff !important; padding:0 !important}
    #loginView,#resetView,#denyView,#appView{display:none !important}
    #printArea{display:block; direction:rtl; color:#000; font-size:12pt}

    .slip{
      border:1.5px dashed #000; border-radius:8px; padding:12px 14px; margin:0 0 9mm;
      break-inside:avoid; page-break-inside:avoid;
    }
    .slip-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
      border-bottom:1px solid #000; padding-bottom:6px; margin-bottom:10px}
    .slip-brand{font-weight:800; font-size:16pt}
    .slip-brand small{font-weight:500; font-size:9pt; letter-spacing:2px; margin-inline-start:6px}
    .slip-title{font-weight:700; font-size:11pt}
    .slip-code{
      border:3px solid #000; border-radius:10px; text-align:center;
      font-weight:800; font-size:34pt; line-height:1.15; padding:6px 10px; letter-spacing:2px;
    }
    .slip-when{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
      font-size:13pt; font-weight:700; margin:10px 2px 8px}
    .slip-to{border:1.5px solid #000; border-radius:8px; padding:8px 12px; margin:0 0 10px}
    .to-h{font-size:9pt; font-weight:700; letter-spacing:.5px; margin-bottom:2px}
    .to-name{font-size:15pt; font-weight:800}
    .to-phone{font-size:20pt; font-weight:800; letter-spacing:1px; margin:2px 0 4px; text-align:right}
    .to-addr{font-size:12pt; line-height:1.5; margin-top:2px}
    .to-mark{font-size:13pt; font-weight:800; margin-top:5px; padding:4px 8px; border:1.5px dashed #000; border-radius:6px}
    .to-surprise{margin-top:6px; padding:4px 8px; background:#000; color:#fff; font-size:12pt; font-weight:800; text-align:center; border-radius:6px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .slip-warn{border:2px solid #000; padding:8px 12px; margin:0 0 10px; font-weight:800; font-size:12pt; text-align:center}
    .slip table{width:100%; border-collapse:collapse; margin-bottom:6px}
    .slip th{font-size:10pt; text-align:right; border-bottom:1.5px solid #000; padding:4px 6px}
    .slip td{padding:7px 6px; border-bottom:1px solid #999; font-size:13pt; vertical-align:middle}
    .slip td.ck{width:28px}
    .slip td.q{width:70px; text-align:center; font-weight:800; font-size:15pt}
    .slip th.q{text-align:center}
    .box{display:inline-block; width:16px; height:16px; border:2px solid #000; border-radius:3px}
    .slip-total{font-weight:700; font-size:11pt; margin:4px 2px 12px}
    .slip-sign{display:flex; gap:18px; font-size:10pt; margin-bottom:12px}
    .slip-sign span{flex:1; border-top:1px solid #000; padding-top:4px}
    .cut{font-size:9pt; text-align:center; border-top:1.5px dashed #000; padding-top:5px; margin-bottom:6px}
    .sticker{
      border:2px solid #000; border-radius:8px; padding:6px 10px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
    }
    .sticker b{font-size:20pt; letter-spacing:1px}
    .sticker span{font-size:11pt; font-weight:700; text-align:left}
    .stamp{font-size:8pt; color:#444; text-align:left; margin-top:6px}
  }
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginView" class="login-wrap">
  <form class="login" id="loginForm" autocomplete="on">
    <div class="brand">
      <img class="logo" src="icon-cream.png" alt="قدّاح"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'✿'}))">
    </div>
    <h1>بوابة المورّد</h1>
    <p class="sub">سجّل الدخول لعرض طلباتك وتأكيد توفّر أصنافك</p>
    <div id="loginError" class="error-box hidden"></div>
    <div id="loginInfo" class="info-box hidden"></div>
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" inputmode="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required autocomplete="current-password">
    </div>
    <button class="btn wide" id="loginBtn" type="submit">دخول</button>
    <button class="link-btn" id="forgotBtn" type="button" onclick="forgotPassword()">نسيت كلمة المرور؟</button>
  </form>
</div>

<!-- ==================== RESET PASSWORD ==================== -->
<div id="resetView" class="login-wrap hidden">
  <form class="login" id="resetForm">
    <div class="brand">
      <img class="logo" src="icon-cream.png" alt="قدّاح"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'✿'}))">
    </div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub">اختر كلمة مرور جديدة لحسابك</p>
    <div id="resetError" class="error-box hidden"></div>
    <div class="field">
      <label for="newPass">كلمة المرور الجديدة</label>
      <input id="newPass" type="password" required autocomplete="new-password" placeholder="8 أحرف على الأقل">
    </div>
    <div class="field">
      <label for="newPass2">تأكيد كلمة المرور</label>
      <input id="newPass2" type="password" required autocomplete="new-password">
    </div>
    <button class="btn wide" id="resetBtn" type="submit">حفظ كلمة المرور</button>
  </form>
</div>

<!-- ==================== NOT-SUPPLIER ==================== -->
<div id="denyView" class="login-wrap hidden">
  <div class="login" style="text-align:center">
    <div class="brand" style="justify-content:center">
      <img class="logo" src="icon-cream.png" alt="قدّاح"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'✿'}))">
    </div>
    <h1>هذه الصفحة للموردين</h1>
    <p class="sub">هذا الحساب ليس حساب مورّد. راجع الإدارة إن كنت تظن أن هذا خطأ.</p>
    <button class="btn ghost wide" onclick="doSignOut()">تسجيل الخروج</button>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="appView" class="hidden">
  <div class="topbar">بوابة المورّد · قدّاح</div>
  <header class="appbar">
    <div class="brand">
      <img class="logo" src="icon-cream.png" alt="قدّاح"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'✿'}))">
      <div class="names">
        <span class="name-ar">قدّاح</span>
        <span class="name-sub">بوابة المورّد</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <span class="updated" id="updated"></span>
      <button class="btn ghost small" id="refreshBtn" onclick="loadLines(true)">تحديث</button>
      <button class="btn ghost small" onclick="doSignOut()">خروج</button>
    </div>
  </header>

  <main>
    <div class="summary" id="summary"></div>
    <div class="printbar" id="printBar"></div>
    <div id="list"></div>
  </main>
</div>

<!-- print sheet: filled by JS right before window.print(), shown only when printing -->
<div id="printArea" dir="rtl"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIG — paste the publishable (anon) key, same one used by
   the store and dashboard. RLS protects everything.
   ============================================================ */
const SUPABASE_URL = "https://tsqkqoibfxachknfmzjj.supabase.co";
const SUPABASE_KEY = "sb_publishable_JyCAQnMnltVq9nESIZjNew_St2FI6Ch"; // sb_publishable_...

const POLL_MS = 30000;

const KEY_MISSING = !SUPABASE_KEY || SUPABASE_KEY.indexOf("PASTE_") === 0;
// read before createClient: Supabase clears the URL hash once the client starts
const IS_RECOVERY = location.hash.includes("type=recovery");
const RECOVERY_EXPIRED = location.hash.includes("error_code=otp_expired");
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
sb.auth.onAuthStateChange((event)=>{ if (event === "PASSWORD_RECOVERY") showResetView(); });

/* ---- status dictionaries (display only; DB stays English) ---- */
const ORDER_STATUS_AR = {
  pending:"طلب جديد", sent_to_supplier:"أُرسل للمورد", confirmed:"مؤكّد",
  prepared:"جُهّز", picked_up:"مع التوصيل", delivered:"تم التوصيل", cancelled:"ملغى"
};
const SUPPLIER_STATUS_AR = {
  pending:"بانتظار التأكيد", confirmed:"مؤكّد", unavailable:"غير متوفّر",
  prepared:"جُهّز", picked_up:"مع التوصيل"
};
// orders where the supplier can no longer act on their lines
const LOCKED = ["delivered","cancelled"];
const orderBadgeClass = s =>
  s==="cancelled" ? "bad" : (["confirmed","prepared","picked_up","delivered"].includes(s) ? "good" : "");

/* ---- element refs ---- */
const el = id => document.getElementById(id);
let pollTimer = null;

/* ============================================================
   AUTH
   ============================================================ */
el("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = el("loginBtn");
  const errBox = el("loginError");
  errBox.classList.add("hidden");

  if (KEY_MISSING){
    errBox.textContent = "المفتاح العلني غير مضبوط في الملف (SUPABASE_KEY). الصق مفتاح anon أولاً.";
    errBox.classList.remove("hidden");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ الدخول';
  const { error } = await sb.auth.signInWithPassword({
    email: el("email").value.trim(),
    password: el("password").value
  });
  btn.disabled = false;
  btn.textContent = "دخول";
  if (error){
    const m = (error.message || "").toLowerCase();
    let ar;
    if (m.includes("invalid api key") || m.includes("no api key"))
      ar = "المفتاح العلني خطأ أو ناقص. تأكّد من لصق مفتاح anon الصحيح.";
    else if (m.includes("email not confirmed"))
      ar = "بريد هذا الحساب غير مؤكَّد. أكّده من لوحة Supabase (Authentication) ثم أعد المحاولة.";
    else if (m.includes("invalid login credentials"))
      ar = "البريد أو كلمة المرور غير صحيحة، أو أن هذا الحساب لا يملك كلمة مرور دخول.";
    else
      ar = "تعذّر تسجيل الدخول.";
    errBox.innerHTML = ar + '<br><span style="opacity:.7;font-size:12px;direction:ltr;display:inline-block">'
      + escapeHtml(error.message || "") + '</span>';
    errBox.classList.remove("hidden");
    return;
  }
  await afterLogin();
});

async function doSignOut(){
  stopPolling();
  await sb.auth.signOut();
  el("appView").classList.add("hidden");
  el("denyView").classList.add("hidden");
  el("loginView").classList.remove("hidden");
  el("password").value = "";
}

async function afterLogin(){
  // role gate: this page is for suppliers only
  const { data: prof, error } = await sb.from("profiles").select("role").single();
  if (error || !prof || prof.role !== "supplier"){
    el("loginView").classList.add("hidden");
    el("appView").classList.add("hidden");
    el("denyView").classList.remove("hidden");
    return;
  }
  el("loginView").classList.add("hidden");
  el("denyView").classList.add("hidden");
  el("appView").classList.remove("hidden");
  el("list").innerHTML = '<div class="center-load"><span class="spin dark"></span></div>';
  await loadLines(false);
  startPolling();
}

/* ============================================================
   DATA
   ============================================================ */
async function loadLines(manual){
  const btn = el("refreshBtn");
  if (manual){ btn.disabled = true; btn.innerHTML = '<span class="spin dark"></span> تحديث'; }

  const { data, error } = await sb
    .from("supplier_order_lines")
    .select("*")
    .order("order_created_at", { ascending:false });

  if (manual){ btn.disabled = false; btn.textContent = "تحديث"; }

  if (error){
    el("summary").innerHTML = "";
    el("list").innerHTML =
      '<div class="msg"><div class="big">تعذّر تحميل الطلبات</div>'+
      '<div>حدث خطأ في الاتصال. جرّب زر التحديث بعد قليل.</div></div>';
    return;
  }
  // delivery details (recipient, phone, address, landmark) are only used on the print slip
  const dres = await sb.from("supplier_order_delivery").select("*");
  DELIVERY_OK = !dres.error;
  DELIVERY = new Map((dres.data || []).map(r => [r.order_id, r]));

  render(data || []);
  stampUpdated();
}

function stampUpdated(){
  const t = new Date();
  const hh = String(t.getHours()).padStart(2,"0");
  const mm = String(t.getMinutes()).padStart(2,"0");
  el("updated").textContent = "آخر تحديث " + hh + ":" + mm;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(rows){
  // group lines by order
  const map = new Map();
  for (const r of rows){
    if (!map.has(r.order_id)) map.set(r.order_id, { head:r, lines:[] });
    map.get(r.order_id).lines.push(r);
  }
  const orders = [...map.values()];
  ORDERS = orders;
  renderPrintBar();

  // summary: orders that are mine, + my lines still awaiting an action from me
  const myActionable = rows.filter(r => ["pending","confirmed","prepared"].includes(r.supplier_status)).length;
  el("summary").innerHTML =
    '<div class="stat"><div class="num">'+orders.length+'</div><div class="lbl">طلب يخصّك</div></div>'+
    '<div class="stat attention"><div class="num">'+myActionable+'</div><div class="lbl">صنف ينتظر إجراءً منك</div></div>';

  if (!orders.length){
    el("list").innerHTML =
      '<div class="msg"><div class="big">لا توجد طلبات تخصّك حالياً</div>'+
      '<div>ستظهر هنا الأصناف التي تُطلب منك فور وصولها.</div></div>';
    return;
  }

  el("list").innerHTML = orders.map(renderOrder).join("");
}

function renderOrder(o){
  const h = o.head;
  const locked = LOCKED.includes(h.order_status);
  const delivery =
    'التسليم: <b>'+ (h.delivery_date || "غير محدّد") +'</b>' +
    (h.delivery_slot ? ' · '+escapeHtml(h.delivery_slot) : '');

  const linesHtml = o.lines.map(l => renderLine(l, locked)).join("");

  // one contextual bulk button, matching the earliest open stage of this order's lines
  let foot = "";
  if (locked){
    foot = '<div class="order-foot"><p class="foot-note">هذا الطلب لم يعد يقبل تعديلاً.</p></div>';
  } else {
    const n = st => o.lines.filter(l => l.supplier_status === st).length;
    if (n("pending") > 0){
      foot = bulkBtn(h.order_id, "pending", "confirmed", "تأكيد كل الأصناف المتبقية ("+n("pending")+")");
    } else if (n("confirmed") > 0){
      foot = bulkBtn(h.order_id, "confirmed", "prepared", "تجهيز كل الأصناف المؤكّدة ("+n("confirmed")+")");
    } else if (n("prepared") > 0){
      foot = bulkBtn(h.order_id, "prepared", "picked_up", "إخراج كل الأصناف مع التوصيل ("+n("prepared")+")");
    }
  }

  return (
    '<div class="order" data-order="'+h.order_id+'">'+
      '<div class="order-head">'+
        '<span class="order-code">'+escapeHtml(h.order_code || "")+'</span>'+
        '<span class="spacer"></span>'+
        (isPrintable(o)
          ? '<button class="btn ghost small" onclick="printOrders([\''+h.order_id+'\'])">🖨 طباعة</button>'
          : '')+
        '<span class="obadge '+orderBadgeClass(h.order_status)+'">'+
          (ORDER_STATUS_AR[h.order_status] || h.order_status)+'</span>'+
        '<div class="delivery">'+delivery+'</div>'+
      '</div>'+
      '<div class="lines">'+linesHtml+'</div>'+
      foot+
    '</div>'
  );
}

function bulkBtn(orderId, from, to, label){
  return '<div class="order-foot"><button class="btn wide small" '+
    'onclick="advanceAll(\''+orderId+'\',\''+from+'\',\''+to+'\')">'+label+'</button></div>';
}

function renderLine(l, locked){
  const st = l.supplier_status;
  const chip = '<span class="sbadge '+st+'">'+(SUPPLIER_STATUS_AR[st] || st)+'</span>';
  const lid = l.line_id;

  // stage-appropriate action buttons; terminal/locked lines show the chip only
  let actions = "";
  if (!locked){
    if (st === "pending"){
      actions =
        '<div class="actions" data-line="'+lid+'">'+
          '<button class="act ok" onclick="setLine(\''+lid+'\',\'confirmed\',this)">مؤكّد</button>'+
          '<button class="act bad" onclick="setLine(\''+lid+'\',\'unavailable\',this)">غير متوفّر</button>'+
        '</div>';
    } else if (st === "confirmed"){
      actions =
        '<div class="actions" data-line="'+lid+'">'+
          '<button class="act go" onclick="setLine(\''+lid+'\',\'prepared\',this)">جهّزت أصنافي</button>'+
          '<button class="act bad" onclick="setLine(\''+lid+'\',\'unavailable\',this)">غير متوفّر</button>'+
        '</div>';
    } else if (st === "prepared"){
      actions =
        '<div class="actions" data-line="'+lid+'">'+
          '<button class="act go" onclick="setLine(\''+lid+'\',\'picked_up\',this)">خرج مع التوصيل</button>'+
        '</div>';
    }
  }

  return (
    '<div class="line">'+
      '<span class="pname grow">'+escapeHtml(l.product_name || "")+'</span>'+
      '<span class="qty">×'+ (l.quantity ?? 1) +'</span>'+
      chip+
      actions+
    '</div>'
  );
}

/* ============================================================
   PRINT (delivery slip: supplier-safe fields only, no customer data)
   ============================================================ */
let ORDERS = [];   // grouped orders from the last load, used by the print buttons
let DELIVERY = new Map();   // order_id -> recipient / address row (view supplier_order_delivery)
let DELIVERY_OK = false;    // false when the view could not be read (SQL not run yet)

const liveLines   = o => o.lines.filter(l => l.supplier_status !== "unavailable");
const isPrintable = o => !LOCKED.includes(o.head.order_status) && liveLines(o).length > 0;
// ready for the driver: every available line is prepared but not yet handed over
const isReady     = o => { const ls = liveLines(o); return isPrintable(o) && ls.length>0 && ls.every(l => l.supplier_status === "prepared"); };
// still on my table: at least one line not yet handed to the driver
const isOpenOrder = o => isPrintable(o) && liveLines(o).some(l => ["pending","confirmed","prepared"].includes(l.supplier_status));

function renderPrintBar(){
  const ready = ORDERS.filter(isReady).length;
  const open  = ORDERS.filter(isOpenOrder).length;
  el("printBar").innerHTML = open
    ? '<button class="btn ghost small" '+(ready?'':'disabled ')+'onclick="printOrders(\'ready\')">🖨 طباعة الجاهز للتسليم ('+ready+')</button>'+
      '<button class="btn ghost small" onclick="printOrders(\'open\')">🖨 طباعة كل الطلبات الجارية ('+open+')</button>'
    : '';
}

function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? m[3]+"/"+m[2]+"/"+m[1] : "";
}
function weekdayAr(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  if (!m) return "";
  try { return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString("ar", { weekday:"long" }); }
  catch(e){ return ""; }
}

// keep time ranges like 08:00-10:00 left-to-right inside Arabic text
function fmtSlot(t){
  return escapeHtml(t || "").replace(/(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/g,
    '<bdi dir="ltr">$1-$2</bdi>');
}

// recipient block for the driver: name, phone, address, nearest landmark, notes, surprise flag
function recipientHtml(orderId){
  const d = DELIVERY.get(orderId);
  if (!d) return '<div class="slip-warn">بيانات المستلم والعنوان غير متاحة. راجع الإدارة قبل التسليم.</div>';

  // the checkout also writes the landmark inside the address text; show it once, as its own line
  let landmark = String(d.delivery_landmark || "").trim();
  const keep = [];
  for (const ln of String(d.delivery_address || "").split(/\r?\n/)){
    const m = /^\s*أقرب نقطة دالة\s*[:：]\s*(.*)$/.exec(ln);
    if (m){ if (!landmark) landmark = m[1].trim(); }
    else if (ln.trim()) keep.push(ln.trim());
  }
  const addr = keep.join("، ");
  const place = [d.delivery_governorate, d.delivery_area].filter(Boolean).join("، ");
  const placeInAddr = d.delivery_area ? addr.includes(d.delivery_area) : addr.includes(place);
  const addrLine = [place && !placeInAddr ? place : "", addr].filter(Boolean).join("، ");

  return (
    '<div class="slip-to">'+
      '<div class="to-h">المستلم</div>'+
      '<div class="to-name">' + escapeHtml(d.recipient_name || "—") + '</div>'+
      '<div class="to-phone"><bdi dir="ltr">' + escapeHtml(d.recipient_phone || "—") + '</bdi></div>'+
      (addrLine ? '<div class="to-addr"><b>العنوان:</b> ' + escapeHtml(addrLine) + '</div>' : '')+
      (landmark ? '<div class="to-mark">أقرب نقطة دالة: ' + escapeHtml(landmark) + '</div>' : '')+
      (d.delivery_notes && String(d.delivery_notes).trim()
        ? '<div class="to-addr"><b>ملاحظات:</b> ' + escapeHtml(String(d.delivery_notes).trim()) + '</div>' : '')+
      (d.is_surprise ? '<div class="to-surprise">مفاجأة: لا تتصلوا بالمستلم قبل الوصول</div>' : '')+
    '</div>'
  );
}

function slipHtml(o, stamp){
  const h = o.head;
  const lines = liveLines(o);
  const pieces = lines.reduce((s,l) => s + (l.quantity ?? 1), 0);
  const d = fmtDate(h.delivery_date);
  const when = d
    ? weekdayAr(h.delivery_date) + ' <bdi dir="ltr">' + d + '</bdi>'
    : 'غير محدّد';
  const slot = h.delivery_slot ? '<bdi>' + fmtSlot(h.delivery_slot) + '</bdi>' : '';
  const code = '<bdi dir="ltr">' + escapeHtml(h.order_code || "") + '</bdi>';

  const rows = lines.map(l =>
    '<tr><td class="ck"><span class="box"></span></td>'+
    '<td>' + escapeHtml(l.product_name || "") + '</td>'+
    '<td class="q">' + (l.quantity ?? 1) + '</td></tr>'
  ).join("");

  return (
    '<div class="slip">'+
      '<div class="slip-top">'+
        '<span class="slip-brand">قدّاح<small>QADAH</small></span>'+
        '<span class="slip-title">ورقة تسليم الطلب</span>'+
      '</div>'+
      '<div class="slip-code">' + code + '</div>'+
      '<div class="slip-when"><span>التسليم: ' + when + '</span>' + (slot ? '<span>' + slot + '</span>' : '') + '</div>'+
      recipientHtml(h.order_id)+
      '<table><thead><tr><th></th><th>الصنف</th><th class="q">الكمية</th></tr></thead><tbody>' + rows + '</tbody></table>'+
      '<div class="slip-total">عدد القطع: ' + pieces + '</div>'+
      '<div class="slip-sign"><span>اسم السائق</span><span>التوقيع</span></div>'+
      '<div class="cut">✂ قصّ والصق على غلاف الطلب</div>'+
      '<div class="sticker"><b>' + code + '</b><span>' + (d ? '<bdi dir="ltr">' + d + '</bdi>' : '') + (slot ? '<br>' + slot : '') + '</span></div>'+
      '<div class="stamp">طُبعت ' + stamp + '</div>'+
    '</div>'
  );
}

// ids: an array of order ids, or "ready" / "open"
function printOrders(ids){
  let list;
  if (ids === "ready")      list = ORDERS.filter(isReady);
  else if (ids === "open")  list = ORDERS.filter(isOpenOrder);
  else                      list = ORDERS.filter(o => ids.includes(o.head.order_id) && isPrintable(o));
  if (!list.length){ alert("لا توجد طلبات للطباعة."); return; }

  // driver gets them in delivery order: date, then slot, then order code
  list = list.slice().sort((a,b) =>
    String(a.head.delivery_date || "9999").localeCompare(String(b.head.delivery_date || "9999")) ||
    String(a.head.delivery_slot || "").localeCompare(String(b.head.delivery_slot || "")) ||
    String(a.head.order_code || "").localeCompare(String(b.head.order_code || "")));

  const t = new Date(), p = n => String(n).padStart(2,"0");
  const stamp = '<bdi dir="ltr">' + p(t.getDate()) + "/" + p(t.getMonth()+1) + "/" + t.getFullYear() +
                " " + p(t.getHours()) + ":" + p(t.getMinutes()) + '</bdi>';

  el("printArea").innerHTML = list.map(o => slipHtml(o, stamp)).join("");
  // let the browser lay the sheet out before opening the print dialog
  requestAnimationFrame(()=> setTimeout(()=> window.print(), 50));
}
window.addEventListener("afterprint", ()=>{ el("printArea").innerHTML = ""; });

/* ============================================================
   ACTIONS (write via confirm_order_line only)
   ============================================================ */
async function setLine(lineId, status, btn){
  const group = btn.closest(".actions");
  if (group) group.querySelectorAll(".act").forEach(b => b.classList.add("busy"));
  const { error } = await sb.rpc("confirm_order_line", { p_line_id: lineId, p_new_status: status });
  if (error){
    if (group) group.querySelectorAll(".act").forEach(b => b.classList.remove("busy"));
    alert("تعذّر حفظ الحالة. حاول مرة أخرى.");
    return;
  }
  await loadLines(false); // re-read so order status / promotion reflect
}

// advance every line of an order that is at `from` to `to` (bulk, one stage)
async function advanceAll(orderId, from, to){
  const card = document.querySelector('.order[data-order="'+orderId+'"]');
  const foot = card ? card.querySelector(".order-foot button") : null;

  const { data, error } = await sb
    .from("supplier_order_lines")
    .select("line_id,supplier_status")
    .eq("order_id", orderId);
  if (error){ alert("تعذّر التحديث. حاول مرة أخرى."); return; }
  const targets = (data||[]).filter(r => r.supplier_status === from);
  if (!targets.length){ await loadLines(false); return; }

  if (foot){ foot.disabled = true; foot.innerHTML = '<span class="spin"></span> جارٍ الحفظ'; }
  for (const r of targets){
    const { error:e } = await sb.rpc("confirm_order_line", { p_line_id:r.line_id, p_new_status:to });
    if (e){ alert("تعذّر تحديث أحد الأصناف. أُعيد التحميل."); break; }
  }
  await loadLines(false);
}

/* ============================================================
   POLLING (silent, pauses when tab hidden)
   ============================================================ */
function startPolling(){
  stopPolling();
  pollTimer = setInterval(()=>{ if (!document.hidden) loadLines(false); }, POLL_MS);
}
function stopPolling(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
document.addEventListener("visibilitychange", ()=>{
  if (!document.hidden && !el("appView").classList.contains("hidden")) loadLines(false);
});

/* ============================================================
   UTIL + SESSION RESTORE
   ============================================================ */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ============================================================
   PASSWORD RECOVERY
   ============================================================ */
function showResetView(){
  stopPolling();
  ["loginView","denyView","appView"].forEach(id => el(id).classList.add("hidden"));
  el("resetView").classList.remove("hidden");
  setTimeout(()=>el("newPass").focus(), 50);
}

el("resetForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const p1 = el("newPass").value, p2 = el("newPass2").value;
  const errBox = el("resetError");
  errBox.classList.add("hidden");
  const fail = t => { errBox.textContent = t; errBox.classList.remove("hidden"); };
  if (p1.length < 8) return fail("كلمة المرور لازم تكون 8 أحرف على الأقل.");
  if (p1 !== p2) return fail("كلمتا المرور غير متطابقتين.");

  const btn = el("resetBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ الحفظ';
  const { error } = await sb.auth.updateUser({ password: p1 });
  btn.disabled = false;
  btn.textContent = "حفظ كلمة المرور";
  if (error) return fail(error.message || "تعذّر حفظ كلمة المرور.");

  history.replaceState(null, "", location.pathname);
  el("resetView").classList.add("hidden");
  await afterLogin();
});

async function forgotPassword(){
  const errBox = el("loginError"), info = el("loginInfo");
  errBox.classList.add("hidden"); info.classList.add("hidden");
  const email = el("email").value.trim();
  if (!email){
    errBox.textContent = "اكتب بريدك الإلكتروني أولاً، ثم اضغط \"نسيت كلمة المرور؟\".";
    errBox.classList.remove("hidden");
    el("email").focus();
    return;
  }
  const btn = el("forgotBtn");
  btn.disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname   // يرجع لهذه الصفحة نفسها
  });
  btn.disabled = false;
  if (error){
    const m = (error.message || "").toLowerCase();
    errBox.textContent = m.includes("rate limit")
      ? "طلبات كثيرة خلال وقت قصير. انتظر قليلاً ثم حاول مرة أخرى."
      : "تعذّر إرسال رابط الاستعادة.";
    errBox.classList.remove("hidden");
    return;
  }
  info.textContent = "إذا كان البريد مسجّلاً، سيصلك رابط لتعيين كلمة مرور جديدة. تحقّق من البريد (والـ Spam).";
  info.classList.remove("hidden");
}

(async function init(){
  if (RECOVERY_EXPIRED){
    history.replaceState(null, "", location.pathname);
    el("loginError").textContent = "رابط استعادة كلمة المرور منتهي أو مستخدم من قبل. اطلب رابطاً جديداً.";
    el("loginError").classList.remove("hidden");
  }
  const { data:{ session } } = await sb.auth.getSession();
  if (IS_RECOVERY && session){ showResetView(); return; }   // no dashboard before the new password is set
  if (session) await afterLogin();
})();
</script>
