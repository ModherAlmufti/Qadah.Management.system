<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>مدفوعات الموقع · قدّاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#01183a; --navy-dark:#000f28; --rose:#dca096; --rose-strong:#c98578; --rose-soft:#f4e4df;
    --cream-page:#fbf6ee; --cream:#f5ede0; --card:#fffdfa; --ink:#24303c; --muted:#8f8781; --line:#ece2d4;
    --ok:#2e7d5b; --ok-soft:#e6f1ea; --bad:#b23b34; --bad-soft:#f7e6e4;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream-page);color:var(--ink);min-height:100vh}
  button,input{font-family:inherit}
  header{background:var(--navy);color:var(--cream);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:800}
  header .sp{flex:1}
  header a,header button{color:var(--cream);background:transparent;border:1px solid rgba(251,246,238,.3);border-radius:10px;padding:7px 12px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
  main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
  .note{background:var(--rose-soft);color:var(--navy);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tools input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px}
  .btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--navy);color:#fff;cursor:pointer}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.bad{background:var(--bad)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;vertical-align:top}
  th{background:var(--cream);color:var(--navy);font-weight:800;font-size:13px}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--rose-soft);color:var(--navy)}
  .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts .btn{padding:6px 10px;font-size:13px}
  .ops{font-size:12px;color:var(--muted);margin-top:4px}
  .muted{color:var(--muted)} .empty{padding:30px;text-align:center;color:var(--muted)}
  .login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
  .login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--cream-page);font-size:15px}
  .err{color:var(--bad);font-weight:700;font-size:14px;min-height:20px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:9;max-width:92vw}
</style>
</head>
<body>
<header>
  <h1>💳 مدفوعات الموقع (بوابة Qi)</h1>
  <span class="sp"></span>
  <a href="index.html">اللوحة</a>
  <button id="outBtn" type="button" style="display:none">خروج</button>
</header>

<div id="loginBox" class="login" style="display:none">
  <h2 style="margin:0 0 14px;color:var(--navy)">تسجيل الدخول</h2>
  <input id="em" type="email" placeholder="البريد" autocomplete="email">
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <p class="err" id="loginErr"></p>
  <button class="btn" id="loginBtn" type="button" style="width:100%">دخول</button>
</div>

<main id="app" style="display:none">
  <div class="note">الاسترجاع والإلغاء ينفّذان على البوابة مباشرة. مع بيانات الإنتاج هذه أموال حقيقية، فراجع المبلغ قبل التأكيد. هذه الصفحة للمدير فقط.</div>
  <div class="tools">
    <input id="q" type="search" placeholder="بحث برقم الطلب أو paymentId">
    <button class="btn ghost" id="reload" type="button">تحديث</button>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>الطلب</th><th>الوقت</th><th>المبلغ</th><th>الحالة</th><th>المسترجع</th><th>paymentId</th><th>إجراءات</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">جارٍ التحميل…</td></tr></tbody>
    </table>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tsqkqoibfxachknfmzjj.supabase.co";
const SUPABASE_KEY = "sb_publishable_JyCAQnMnltVq9nESIZjNew_St2FI6Ch";
const ADMIN_FN = SUPABASE_URL + "/functions/v1/qi-gateway-admin";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); // same session as the dashboard

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n) => new Intl.NumberFormat("en-US").format(Math.round(Number(n) || 0)) + " د.ع";
const when = (d) => { const x = new Date(d); const p = (n) => String(n).padStart(2, "0");
  return `${p(x.getDate())}/${p(x.getMonth()+1)}/${x.getFullYear()} ${p(x.getHours())}:${p(x.getMinutes())}`; };
let toastT; function toast(t){ const e=$("toast"); e.textContent=t; e.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>e.style.display="none",4000); }

const STATUS_AR = { CREATING:"قيد الإنشاء", CREATED:"بانتظار الدفع", SUCCESS:"مدفوع", FAILED:"فشل", AUTHENTICATION_FAILED:"فشل التحقق 3DS", ERROR:"خطأ" };
function statusChip(r){
  if (r.canceled) return '<span class="chip bad">ملغى</span>';
  const ref = Number(r.refunded_amount) || 0;
  if (ref > 0) return ref >= Number(r.amount) ? '<span class="chip">مسترجع</span>' : '<span class="chip">مسترجع جزئياً</span>';
  const cls = r.status === "SUCCESS" ? "ok" : (["FAILED","AUTHENTICATION_FAILED","ERROR"].includes(r.status) ? "bad" : "");
  return `<span class="chip ${cls}">${esc(STATUS_AR[r.status] || r.status)}</span>`;
}

let ROWS = [];
async function load(){
  const { data, error } = await sb.from("gateway_payments")
    .select("id, order_code, payment_id, amount, status, canceled, refunded_amount, created_at, gateway_operations(kind, amount, ok, status, created_at)")
    .order("created_at", { ascending: false }).limit(200);
  if (error) { $("rows").innerHTML = `<tr><td colspan="7" class="empty">تعذّر التحميل: ${esc(error.message)}</td></tr>`; return; }
  ROWS = data || []; render();
}
function render(){
  const q = $("q").value.trim().toLowerCase();
  const list = ROWS.filter(r => !q || (r.order_code||"").toLowerCase().includes(q) || (r.payment_id||"").toLowerCase().includes(q));
  if (!list.length) { $("rows").innerHTML = '<tr><td colspan="7" class="empty">لا توجد مدفوعات بعد</td></tr>'; return; }
  $("rows").innerHTML = list.map(r => {
    const paid = r.status === "SUCCESS" && !r.canceled;
    const remaining = Number(r.amount) - Number(r.refunded_amount);
    const ops = (r.gateway_operations || []).map(o => `${o.kind === "refund" ? "استرجاع" : "إلغاء"} ${o.amount ? fmt(o.amount) : ""} ${o.ok ? "✓" : "✗ " + esc(o.status || "")}`).join(" · ");
    return `<tr>
      <td><b class="ltr">${esc(r.order_code || "-")}</b></td>
      <td class="ltr">${when(r.created_at)}</td>
      <td>${fmt(r.amount)}</td>
      <td>${statusChip(r)}</td>
      <td>${Number(r.refunded_amount) > 0 ? fmt(r.refunded_amount) : '<span class="muted">-</span>'}</td>
      <td class="ltr" style="font-size:12px">${esc(r.payment_id || "-")}</td>
      <td><div class="acts">
        <button class="btn ghost" data-a="status" data-id="${r.id}" ${r.payment_id ? "" : "disabled"}>تحقق</button>
        <button class="btn" data-a="refund" data-id="${r.id}" data-rem="${remaining}" ${paid && remaining > 0 ? "" : "disabled"}>استرجاع</button>
        <button class="btn bad" data-a="cancel" data-id="${r.id}" ${r.payment_id && !r.canceled && !(Number(r.refunded_amount) > 0) ? "" : "disabled"}>إلغاء</button>
      </div>${ops ? `<div class="ops">${ops}</div>` : ""}</td>
    </tr>`;
  }).join("");
}

async function act(action, id, extra){
  const { data: s } = await sb.auth.getSession();
  const token = s?.session?.access_token;
  if (!token) { toast("انتهت الجلسة، سجّل الدخول مرة ثانية"); return null; }
  const res = await fetch(ADMIN_FN, { method:"POST",
    headers:{ "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:"Bearer " + token },
    body: JSON.stringify({ action, gatewayPaymentId:id, ...(extra||{}) }) });
  const d = await res.json().catch(() => ({}));
  d._http = res.status; return d;
}

$("rows").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, id = b.dataset.id, row = ROWS.find(r => r.id === id);
  let extra = {};
  if (a === "refund") {
    const rem = Number(b.dataset.rem);
    const v = prompt(`مبلغ الاسترجاع للطلب ${row.order_code} (المتبقي ${fmt(rem)}). اتركه كما هو للاسترجاع الكامل:`, String(rem));
    if (v === null) return;
    const amt = Number(String(v).replace(/[,\s]/g, ""));
    if (!(amt > 0 && amt <= rem)) { toast("مبلغ غير صحيح"); return; }
    if (!confirm(`تأكيد استرجاع ${fmt(amt)} للطلب ${row.order_code}؟`)) return;
    extra.amount = amt;
  }
  if (a === "cancel" && !confirm(`تأكيد إلغاء دفعة الطلب ${row.order_code}؟` + (row.status === "SUCCESS" ? " (الدفعة مدفوعة، الإلغاء يعيد المبلغ)" : ""))) return;
  b.disabled = true; const label = b.textContent; b.textContent = "…";
  const d = await act(a, id, extra);
  b.textContent = label; b.disabled = false;
  if (!d) return;
  if (d.ok) {
    toast(a === "status" ? `حالة Qi: ${d.qi?.status || "?"}${d.qi?.canceled ? " (ملغاة)" : ""}` : a === "refund" ? `تم الاسترجاع ${fmt(d.refunded)}${d.full ? " (كامل)" : ""}` : "تم الإلغاء");
  } else {
    const map = { forbidden:"هذه العملية للمدير فقط", not_signed_in:"سجّل الدخول", payments_disabled:"البوابة غير مُعدّة بعد" };
    toast(map[d.error] || `فشل: ${d.error || d._http}${d.code ? " (" + d.code + ")" : ""}${d.message ? " " + d.message : ""}`);
  }
  load();
});
$("q").addEventListener("input", render);
$("reload").addEventListener("click", load);

async function start(){
  const { data: s } = await sb.auth.getSession();
  if (!s?.session) { $("loginBox").style.display = ""; $("app").style.display = "none"; $("outBtn").style.display = "none"; return; }
  const { data: prof } = await sb.from("profiles").select("role").eq("id", s.session.user.id).maybeSingle();
  $("outBtn").style.display = "";
  if (prof?.role !== "admin") { $("loginBox").style.display = "none"; $("app").style.display = ""; $("app").innerHTML = '<div class="empty">هذه الصفحة للمدير فقط.</div>'; return; }
  $("loginBox").style.display = "none"; $("app").style.display = ""; load();
}
$("loginBtn").addEventListener("click", async () => {
  $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("em").value.trim(), password:$("pw").value });
  if (error) { $("loginErr").textContent = error.message; return; }
  start();
});
$("outBtn").addEventListener("click", async () => { await sb.auth.signOut(); start(); });
start();
</script>
</body>
</html>
